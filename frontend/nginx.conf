server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location = /api/healthz { proxy_pass http://backend:8080/api/healthz; proxy_set_header Host $host; }
  location /api/v1/ { proxy_pass http://backend:8080/api/v1/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Request-ID $request_id; }
  location / { try_files $uri $uri/ /index.html; }
}
